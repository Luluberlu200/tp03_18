name: CI/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  # pour déclencher manuellement le déploiement (équivalent de when: manual)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/<owner>/<repo>

jobs:
  # ===== 1) TESTS =====
  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: |
          if [ -f test.py ]; then python -m unittest test.py; else echo "Aucun test défini"; fi

  # ===== 2) BUILD & PUSH DOCKER IMAGE =====
  build-docker-image:
    needs: [ unit-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # nécessaire pour pousser sur GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PRs) / Build & Push (push sur develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ===== 3) DEPLOY (Coolify webhook) =====
  # équivalent de: stage: deploy + when: manual + only: develop
  deploy-job:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    needs: [ build-docker-image ]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        run: |
          echo "Triggering Coolify deployment..."
          curl --location --request POST "${{ secrets.COOLIFY_WEBHOOK }}" \
               --header "Authorization: Bearer ${{ secrets.TOKEN }}" \
               --header "Content-Type: application/json" \
               --data '{}'
